# Server Configuration
server.port=8081
spring.application.name=tenant-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supply_chain_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=tenantEvent:java.util.Map

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-super-secure-jwt-secret-key-change-in-production}
app.jwt.expiration=86400000

# Security
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# Kafka Topics
app.kafka.topics.tenant-events=tenant-events

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.supplychain.tenant=DEBUG
logging.level.org.springframework.security=INFO
