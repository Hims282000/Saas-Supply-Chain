# Test Configuration
spring.profiles.active=test

# Test Database (will be overridden by Testcontainers)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Kafka Test
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Disable Flyway in tests
spring.flyway.enabled=false

# JWT for tests
app.jwt.secret=test-jwt-secret-key-for-testing-only-1234567890
app.jwt.expiration=3600000

# Security
app.cors.allowed-origins=http://localhost:3000

# Disable some features for tests
management.endpoints.web.exposure.include=health